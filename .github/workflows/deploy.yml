# Builds the site and deploys it to GitHub Pages.
#
# Runs on every push to main, once a day (to refresh the GitHub activity graph on the
# Links page), and by hand from the Actions tab.
#
# One-time setup:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   Settings → Secrets and variables → Actions → ACTIVITY_GITHUB_TOKEN: a fine-grained token
#     with "Public repositories (read-only)" access and no other permissions. Without it the
#     graph is hidden.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The site lives in portfolio/; GitHub only reads workflows from the repository root.
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Fetch GitHub activity
        env:
          ACTIVITY_LOGIN: ${{ github.repository_owner }}
          ACTIVITY_GITHUB_TOKEN: ${{ secrets.ACTIVITY_GITHUB_TOKEN }}
        run: node scripts/fetch-github-activity.mjs

      - name: Build
        run: npm run build-only

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
